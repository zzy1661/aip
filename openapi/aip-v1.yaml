          description: 被授予的主体标识。
        can_read:
          type: boolean
          default: true
          description: 是否允许检索该知识版本；缺省为 true。
        can_download:
          type: boolean
          default: false
          description: 是否允许下载来源文件；缺省为 false，且蕴含 `can_read`。

    DocumentGrantItem:
      type: object
      required: [knowledge_id, version, subject, can_read, can_download]
      properties:
        knowledge_id:
          type: string
        version:
          type: string
        subject:
          type: string
        can_read:
          type: boolean
        can_download:
          type: boolean

    DocumentGrantData:
      type: object
      required: [knowledge_id, version, subject, can_read, can_download, authz_revision]
      properties:
        knowledge_id:
          type: string
        version:
          type: string
        subject:
          type: string
        can_read:
          type: boolean
        can_download:
          type: boolean
        authz_revision:
          type: integer
          description: 授权版本；撤销后开始的响应不会使用旧授权。

    DocumentGrantListData:
      type: object
      required: [knowledge_id, version, grants]
      properties:
