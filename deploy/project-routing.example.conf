# aip 与 onto console 的路径路由示例（nginx）
#
# 目的：把 aip 的业务 API 挂到独立的路径前缀上，onto console 的路径完全不受影响。
# 本批**不改动 onto**：onto 相关的 location 块原样保留，aip 只新增自己的 location。
#
# 路径边界：
#   - aip 业务 API：/api/v1/projects/{projectId}/...  （projectId 必须与令牌 scope 一致）
#   - aip 健康检查：/healthz                              （不在项目前缀下，无需鉴权）
#   - onto console：/                                     （其余路径全部交给 onto）
#
# 替换下面的 upstream 主机名与端口即可接入；鉴权由 aip API 自身完成
# （Bearer 令牌 + scope 校验），网关层不做令牌解析。

upstream aip_api {
    server <aip-api-host>:8080;
    keepalive 32;
}

upstream onto_console {
    server <onto-console-host>:<onto-console-port>;
    keepalive 32;
}

server {
    listen 80;
    server_name <aip-and-onto-hostname>;

    # 上传大小必须不小于 aip 的 AIP_UPLOAD_MAX_BYTES（默认 20 MiB），
    # 否则会在到达 aip 之前就被网关截断，表现为 413 而不是平台的 UPLOAD_TOO_LARGE。
    client_max_body_size 21m;

    # aip 健康检查：独立前缀，便于探针直接访问
    location = /healthz {
        proxy_pass http://aip_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # aip 业务 API：路径前缀 /api/v1/ 全部交给 aip
    location /api/v1/ {
        proxy_pass http://aip_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # aip 按 AIP_TRUSTED_PROXY 判断是否信任转发头，两者必须一致
        proxy_set_header X-Aip-Project-Id $http_x_aip_project_id;
        proxy_read_timeout 120s;
    }

    # onto console：其余路径全部保留给 onto，本批不改动 onto 的任何路由行为
    location / {
        proxy_pass http://onto_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# WebSocket 升级所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
